# API Contract: Todo AI Chatbot

## Overview
This document specifies the API contracts for the Todo AI Chatbot, defining the endpoints, request/response formats, and error handling patterns.

## Base URL
```
https://api.yourdomain.com
```

## Authentication
All endpoints require authentication via Better Auth. The user_id is extracted from the authentication context and used to ensure data isolation.

## Common Headers
```
Authorization: Bearer <token>
Content-Type: application/json
```

## API Endpoints

### POST /api/{user_id}/chat

Initiates or continues a conversation with the AI chatbot for a specific user.

#### Path Parameters
- `user_id` (string, required): The unique identifier of the user

#### Request Body
```json
{
  "message": "What should I do today?",
  "conversation_id": "optional-conversation-id"
}
```

#### Response
```json
{
  "conversation_id": "unique-conversation-id",
  "response": "I can help you manage your tasks. You can ask me to add, list, update, or complete tasks.",
  "timestamp": "2026-02-07T10:00:00Z"
}
```

#### Error Responses
- `400 Bad Request`: Invalid request format
- `401 Unauthorized`: Invalid or missing authentication token
- `403 Forbidden`: User is trying to access another user's data
- `404 Not Found`: Conversation not found (if conversation_id was provided)
- `500 Internal Server Error`: Unexpected server error

### GET /api/{user_id}/tasks

Retrieves all tasks for a specific user.

#### Path Parameters
- `user_id` (string, required): The unique identifier of the user

#### Query Parameters
- `status` (string, optional): Filter by task status ("all", "pending", "completed"); defaults to "all"

#### Response
```json
{
  "tasks": [
    {
      "id": "task-uuid",
      "title": "Buy groceries",
      "description": "Milk, eggs, bread",
      "completed": false,
      "created_at": "2026-02-07T09:00:00Z",
      "updated_at": "2026-02-07T09:00:00Z"
    }
  ]
}
```

#### Error Responses
- `401 Unauthorized`: Invalid or missing authentication token
- `403 Forbidden`: User is trying to access another user's data
- `500 Internal Server Error`: Unexpected server error

### POST /api/{user_id}/tasks

Creates a new task for a specific user.

#### Path Parameters
- `user_id` (string, required): The unique identifier of the user

#### Request Body
```json
{
  "title": "Buy groceries",
  "description": "Milk, eggs, bread"
}
```

#### Response
```json
{
  "task": {
    "id": "task-uuid",
    "title": "Buy groceries",
    "description": "Milk, eggs, bread",
    "completed": false,
    "created_at": "2026-02-07T09:00:00Z",
    "updated_at": "2026-02-07T09:00:00Z"
  }
}
```

#### Error Responses
- `400 Bad Request`: Invalid request format or missing required fields
- `401 Unauthorized`: Invalid or missing authentication token
- `403 Forbidden`: User is trying to access another user's data
- `500 Internal Server Error`: Unexpected server error

### PUT /api/{user_id}/tasks/{task_id}

Updates an existing task for a specific user.

#### Path Parameters
- `user_id` (string, required): The unique identifier of the user
- `task_id` (string, required): The unique identifier of the task

#### Request Body
```json
{
  "title": "Updated task title",
  "description": "Updated task description"
}
```

#### Response
```json
{
  "task": {
    "id": "task-uuid",
    "title": "Updated task title",
    "description": "Updated task description",
    "completed": false,
    "created_at": "2026-02-07T09:00:00Z",
    "updated_at": "2026-02-07T10:00:00Z"
  }
}
```

#### Error Responses
- `400 Bad Request`: Invalid request format
- `401 Unauthorized`: Invalid or missing authentication token
- `403 Forbidden`: User is trying to access another user's data
- `404 Not Found`: Task not found
- `500 Internal Server Error`: Unexpected server error

### PUT /api/{user_id}/tasks/{task_id}/complete

Marks a task as completed for a specific user.

#### Path Parameters
- `user_id` (string, required): The unique identifier of the user
- `task_id` (string, required): The unique identifier of the task

#### Response
```json
{
  "task": {
    "id": "task-uuid",
    "title": "Buy groceries",
    "description": "Milk, eggs, bread",
    "completed": true,
    "created_at": "2026-02-07T09:00:00Z",
    "updated_at": "2026-02-07T10:00:00Z"
  }
}
```

#### Error Responses
- `401 Unauthorized`: Invalid or missing authentication token
- `403 Forbidden`: User is trying to access another user's data
- `404 Not Found`: Task not found
- `500 Internal Server Error`: Unexpected server error

### DELETE /api/{user_id}/tasks/{task_id}

Deletes a task for a specific user.

#### Path Parameters
- `user_id` (string, required): The unique identifier of the user
- `task_id` (string, required): The unique identifier of the task

#### Response
```json
{
  "message": "Task deleted successfully"
}
```

#### Error Responses
- `401 Unauthorized`: Invalid or missing authentication token
- `403 Forbidden`: User is trying to access another user's data
- `404 Not Found`: Task not found
- `500 Internal Server Error`: Unexpected server error

## Error Response Format
All error responses follow this format:
```json
{
  "error": {
    "code": "ERROR_CODE",
    "message": "Human-readable error message",
    "details": "Additional error details if applicable"
  }
}
```

## Rate Limiting
All endpoints are subject to rate limiting to prevent abuse:
- Per-user limits: 100 requests per minute
- Per-IP limits: 1000 requests per minute

## Security Considerations
- All user data is isolated by user_id
- Authentication is required for all endpoints
- Input validation is performed on all request parameters
- No sensitive information is exposed in error messages