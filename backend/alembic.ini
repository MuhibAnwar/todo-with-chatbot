[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# max_length = 40

# version_numuer length, if using SQLite
# version_table_pk = true

# version table schema, if using multiple schemas
# version_table_schema =

# dialect specific version_table arguments
# passed to create_engine in each environment.
# Use this to specify options for the dialect used.
# For SQLite dialect, see:
# https://docs.sqlalchemy.org/en/latest/dialects/sqlite.html#dialect-specific-parameters
# sqlite_pragma = locking_mode=NORMAL

# for autogenerate, whether to skip reflection of tables that don't exist
# in the target metadata
# include_symbol = sometable, otherstable

# for autogenerate, whether to include views
# include_views = false

# for autogenerate, whether to include the views from the 'information_schemas' schema
# (MySQL and PostgreSQL)
# include_object_from_information_schema = false

# for autogenerate, specify what tables/columns/functions to skip
# include_object = my_special_function, my_special_table

# for autogenerate, compare only a subset of columns/tables
# tables_auto_validate = my_table, other_table

# for 'revision' command, specifies the versioned SQLAlchemy engine
# url to use, when not using environment.py
# sqlalchemy.url = driver://user:pass@localhost/dbname

# for 'show' command, specifies the versioned SQLAlchemy engine
# url to use, when not using environment.py
# sqlalchemy.show_url = driver://user:pass@localhost/dbname

# for 'history' command, whether to show the revision path
# (path is not shown by default)
# show_history = false

# for 'branches' command, whether to show the branch structure
# (the default value is to not show)
# show_branches = false

# for 'heads' command, whether to show the branch structure
# (the default value is to not show)
# show_heads = false

# for 'current' command, whether to show the branch structure
# (the default value is to not show)
# show_current = false

# for 'upgrade'/'downgrade'/'stamp' commands, whether to show the
# branch structure (the default value is to not show)
# show_operations = false

# for 'upgrade'/'downgrade' commands, whether to output the SQL
# statements to the console (the default value is to not show)
# show_sql = false

# for 'upgrade'/'downgrade' commands, whether to execute the SQL
# statements (the default value is to run)
# run_migrations = true

# for 'revision' command, whether to autogenerate operations
# based on comparison of database and model
# autogenerate = false

# for 'upgrade'/'downgrade' commands, the number of revisions to
# target. 'current' indicates the current revision, 'base' indicates
# the first revision, and 'heads' indicates all heads (the default)
# revision_range = current:base

# for 'merge' command, whether to create a merge point
# merge = false

# for 'merge' command, whether to squash multiple revisions into one
# squash = false

# for 'merge' command, whether to mark the merge as clean
# mark_as_clean = false

# for 'merge' command, the message to use for the merge revision
# merge_message = merging %(revs)s

# for 'merge' command, the label to use for the merge revision
# merge_label = merge

# for 'merge' command, the branch label to use for the merge revision
# merge_branch_label = merge

# for 'merge' command, the parent revision to use for the merge revision
# merge_parent = head

# for 'merge' command, the revision to merge
# merge_rev = head

# for 'merge' command, the revision to merge from
# merge_from_rev = head

# for 'merge' command, the revision to merge to
# merge_to_rev = head

# for 'merge' command, the revision to merge with
# merge_with_rev = head

# for 'merge' command, the revision to merge into
# merge_into_rev = head

# for 'merge' command, the revision to merge from
# merge_from_rev = head

# for 'merge' command, the revision to merge to
# merge_to_rev = head

# for 'merge' command, the revision to merge with
# merge_with_rev = head

# for 'merge' command, the revision to merge into
# merge_into_rev = head


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s